name: status
on:
  workflow_dispatch:
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for Q in RELIABILITY SECURITY; do
            curl -s "https://sonarcloud.io/api/issues/search?componentKeys=home-my-blog_myblog&branch=develop&issueStatuses=OPEN,CONFIRMED&impactSoftwareQualities=$Q&ps=100" > $Q.json
            Q=$Q python3 - <<'PY'
          import json,os
          q=os.environ['Q']; d=json.load(open(q+'.json'))
          print(f"::notice::{q} total {d.get('total')}")
          for i in d.get('issues',[]):
              sev=','.join(x['severity'] for x in i.get('impacts',[]))
              print(f"::notice::{q} {sev} {i['rule']} {i['component'].split(':',1)[-1]}:{i.get('line')} {i['message'][:150]}")
          PY
          done
          curl -s "https://sonarcloud.io/api/hotspots/search?projectKey=home-my-blog_myblog&branch=develop&status=TO_REVIEW&ps=100" | python3 -c "
          import sys,json
          d=json.load(sys.stdin); print('::notice::HOTSPOT total',d.get('paging',{}).get('total'))
          for h in d.get('hotspots',[]): print('::notice::HOTSPOT',h.get('vulnerabilityProbability'),h.get('securityCategory'),h['component'].split(':',1)[-1]+':'+str(h.get('line')),h['message'][:150])"
