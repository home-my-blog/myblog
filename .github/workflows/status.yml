name: status
on:
  workflow_dispatch:
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B="https://sonarcloud.io/api/issues/search?componentKeys=home-my-blog_myblog&branch=develop&issueStatuses=OPEN,CONFIRMED&impactSoftwareQualities=MAINTAINABILITY&ps=1"
          curl -s "$B&facets=impactSeverities,rules,directories,languages" > f.json
          python3 - <<'PY'
          import json
          d=json.load(open('f.json'))
          print('::notice::total', d.get('total'))
          for f in d.get('facets',[]):
              vals=sorted(f['values'],key=lambda v:-v['count'])[:25]
              print('::notice::'+f['property']+' '+'; '.join(f"{v['val']}={v['count']}" for v in vals))
          PY
          curl -s "https://sonarcloud.io/api/rules/search?organization=home-my-blog&rule_keys=$(python3 -c "import json;d=json.load(open('f.json'));print(','.join(v['val'] for f in d['facets'] if f['property']=='rules' for v in sorted(f['values'],key=lambda v:-v['count'])[:25]))")&ps=50&f=name" | python3 -c "import sys,json;[print('::notice::'+r['key']+' '+r['name']) for r in json.load(sys.stdin).get('rules',[])]"
